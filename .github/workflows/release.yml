name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build universal app
        run: HEADSUP_VERSION="${GITHUB_REF_NAME#v}" sh scripts/build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/HeadsUp.zip \
            --title "Heads Up ${GITHUB_REF_NAME#v}" \
            --notes "Install or update: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh\`. See CHANGELOG.md for what changed."
